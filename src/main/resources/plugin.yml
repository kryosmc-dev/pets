name: KryosMascotas
version: 1.0.0
main: com.kryos.mascotas.KryosMascotas
api-version: '1.21'
author: Kryos
description: Mascotas que luchan a tu lado, suben de nivel y desbloquean recompensas, efectos y habilidades.
commands:
  mascota:
    description: Abre el menú de mascotas
    aliases: [mascotas, pet, pets]
    usage: /mascota [invocar <id>|guardar|admin]
permissions:
  kryosmascotas.use:
    description: Usar el sistema de mascotas
    default: true
  kryosmascotas.admin:
    description: Comandos de administración de mascotas
    default: op
